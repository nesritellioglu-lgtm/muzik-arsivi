<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Müzik Arşivi</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>🎵 Birleşik Şarkı Listesi</h2>
    <table id="anaTablo" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Şarkı</th>
                <th>Tür</th>
                <th>Müzik</th>
                <th>Söz</th>
                <th>Fiyat (M)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
    async function verileriGetir() {
        const kullanici = "nesritellioglu-lgtm"; // Burayı değiştir!
        const repo = "muzik-arsivi";
        
        // 1. GitHub'daki tüm dosyaların listesini al
        const response = await fetch(`https://api.github.com/repos/${kullanici}/${repo}/contents/`);
        const dosyalar = await response.json();
        
        let tumSarkilar = [];

        // 2. Sadece JSON/TXT verilerini içerenleri seç ve oku
        for (let dosya of dosyalar) {
            if (dosya.name.includes("JSON") && dosya.name.endsWith(".txt")) {
                const icerikRes = await fetch(dosya.download_url);
                const veri = await icerikRes.json();
                tumSarkilar = tumSarkilar.concat(veri.songs); // Şarkıları listeye ekle 
            }
        }

        // 3. Tabloyu oluştur
        $('#anaTablo').DataTable({
            data: tumSarkilar,
            columns: [
                { data: "name" },          // 
                { data: "genre" },         // 
                { data: "musicQuality" },  // 
                { data: "lyricsQuality" }, // 
                { data: "price" }          // 
            ],
            language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/tr.json" }
        });
    }
    verileriGetir();
    </script>
</body>
</html>
