<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SongMaster Market</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        /* TEMA DEĞİŞKENLERİ */
        :root {
            --bg: #0d0e14; --panel: #161927; --text: #e0e6ed; --border: #2d334a; --primary: #7289da;
        }
        [data-theme="light"] {
            --bg: #f0f2f5; --panel: #ffffff; --text: #1c1e21; --border: #ddd; --primary: #4752c4;
        }

        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; transition: 0.3s; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        
        /* AYARLAR PANELİ */
        .settings-bar { display: flex; gap: 10px; margin-bottom: 15px; justify-content: flex-end; }
        .setting-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }

        .stat-card { background: var(--panel); padding: 12px; border-radius: 10px; border: 1px solid var(--border); min-width: 100px; text-align: center; }
        .cart-panel { background: var(--panel); padding: 15px; border-radius: 12px; border: 2px solid var(--primary); min-width: 300px; }
        #cartItems { font-size: 11px; max-height: 120px; overflow-y: auto; margin: 10px 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
        .cart-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
        .copy-btn { background: #43b581; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }

        .controls { background: var(--panel); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .view-btn { background: #34384e; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .active-view { background: var(--primary) !important; }

        .score-box { display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 4px; font-weight: bold; font-size: 13px; }
        #cardContainer { display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .song-card { background: var(--panel); border-radius: 12px; padding: 15px; border: 1px solid var(--border); }

        table.dataTable { background: var(--panel) !important; color: var(--text) !important; }
        .hit-badge { background: #ff4757; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .instr-tag { background: var(--border); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-size: 10px; margin: 2px; display: inline-block; cursor: pointer; }
        .instr-tag.selected { background: var(--primary); color: white; }
    </style>
</head>
<body data-theme="dark">

    <div class="settings-bar">
        <button class="setting-btn" onclick="toggleTheme()">🌓 Theme</button>
        <button class="setting-btn" onclick="toggleLang()">🌍 Language: <span id="langDisplay">EN</span></button>
    </div>

    <div class="top-bar">
        <div class="stats-panel" style="display:flex; gap:10px;">
            <div class="stat-card"><h3 data-key="stat_total">Archive</h3><p id="s-total">0</p></div>
            <div class="stat-card"><h3>🔥 HIT</h3><p id="s-hit">0</p></div>
        </div>

        <div class="cart-panel">
            <h4 style="margin:0;"><span data-key="cart_title">Selected Songs</span> (<span id="cartCount">0</span>)</h4>
            <ul id="cartItems"></ul>
            <button class="copy-btn" onclick="copyCart()" data-key="btn_copy">Copy for Game</button>
        </div>
    </div>

    <div class="controls">
        <button id="btnTable" class="view-btn active-view" onclick="toggleView('table')" data-key="btn_table">📋 Table</button>
        <button id="btnCards" class="view-btn" onclick="toggleView('cards')" data-key="btn_cards">🎴 Cards</button>
        <select id="genreFilter" style="background:var(--bg); color:var(--text); padding:8px; border-radius:6px; border:1px solid var(--border);">
            <option value="" data-key="opt_all_genres">All Genres</option>
        </select>
        <div id="instrContainer" style="flex-grow:1;"></div>
        <label style="font-size: 13px; cursor:pointer;"><input type="checkbox" id="hitFilter"> <span data-key="chk_hit">Only HIT</span></label>
    </div>

    <div id="tableWrapper">
        <table id="anaTablo" class="display" style="width:100%">
            <thead>
                <tr>
                    <th data-key="th_song">Song</th><th data-key="th_genre">Genre</th><th data-key="th_music">Music</th>
                    <th data-key="th_lyrics">Lyrics</th><th data-key="th_orig">Originality</th>
                    <th data-key="th_instr">Instruments</th><th data-key="th_price">Price</th>
                    <th data-key="th_status">Status</th><th data-key="th_writer">Writer</th>
                    <th>ID</th><th>🛒</th>
                </tr>
            </thead>
        </table>
    </div>
    <div id="cardContainer"></div>

    <script>
    const RAINBOW = [['#ff0000','#fff'],['#ff0036','#fff'],['#ff006c','#fff'],['#ff00a2','#fff'],['#ff00d8','#fff'],['#f000ff','#fff'],['#ba00ff','#fff'],['#8400ff','#fff'],['#4e00ff','#fff'],['#1900ff','#fff'],['#001dff','#fff'],['#0053ff','#fff'],['#0089ff','#fff'],['#00bfff','#fff'],['#00f5ff','#000'],['#00ffd3','#000'],['#00ff9d','#000'],['#00ff67','#000'],['#00ff31','#000'],['#05ff00','#000'],['#3bff00','#000'],['#71ff00','#000'],['#a7ff00','#000'],['#ddff00','#000'],['#ffeb00','#000'],['#ffb500','#000'],['#ff8000','#000']];

    const LANG = {
        tr: {
            stat_total: "Toplam Arşiv", cart_title: "Seçilen Şarkılar", btn_copy: "Verileri Oyuna Göre Kopyala",
            btn_table: "📋 Tablo", btn_cards: "🎴 Kartlar", opt_all_genres: "Tüm Türler", chk_hit: "Sadece HIT",
            th_song: "Şarkı", th_genre: "Tür", th_music: "Müzik", th_lyrics: "Sözler", th_orig: "Özgün",
            th_instr: "Enstrümanlar", th_price: "Fiyat", th_status: "Durum", th_writer: "Yazar",
            msg_head: "İlgilendiğim şarkılar", msg_writer: "Yazar", msg_price: "Fiyat", msg_copied: "Kopyalandı!", cart_empty: "Sepet boş!"
        },
        en: {
            stat_total: "Total Archive", cart_title: "Selected Songs", btn_copy: "Copy Data for Game",
            btn_table: "📋 Table", btn_cards: "🎴 Cards", opt_all_genres: "All Genres", chk_hit: "Only HIT",
            th_song: "Song", th_genre: "Genre", th_music: "Music", th_lyrics: "Lyrics", th_orig: "Originality",
            th_instr: "Instruments", th_price: "Price", th_status: "Status", th_writer: "Writer",
            msg_head: "Songs I'm interested in", msg_writer: "Writer", msg_price: "Price", msg_copied: "Copied!", cart_empty: "Cart is empty!"
        }
    };

    let currentLang = 'en';
    let globalData = [];
    let selectedSongs = [];
    let selectedInstr = [];
    const kullanici = "nesritellioglu-lgtm";
    const repo = "muzik-arsivi";

    function toggleTheme() {
        const body = $('body');
        body.attr('data-theme', body.attr('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function toggleLang() {
        currentLang = currentLang === 'en' ? 'tr' : 'en';
        $('#langDisplay').text(currentLang.toUpperCase());
        updateLangUI();
    }

    function updateLangUI() {
        $('[data-key]').each(function() {
            const key = $(this).data('key');
            $(this).text(LANG[currentLang][key]);
        });
        if ($.fn.DataTable.isDataTable('#anaTablo')) renderTable(); // Tabloyu yeniden dile göre çiz
        renderCards();
    }

    function getRainbowStyle(val) {
        let v = parseInt(val);
        let idx = isNaN(v) ? 0 : Math.min(Math.max(v, 0), RAINBOW.length - 1);
        let colors = RAINBOW[idx];
        return `background:${colors[0]}; color:${colors[1]};`;
    }

    async function baslat() {
        const res = await fetch(`https://api.github.com/repos/${kullanici}/${repo}/contents/?t=${Date.now()}`);
        const dosyalar = await res.json();
        for (let f of dosyalar) {
            if (f.name.toUpperCase().includes("JSON") && (f.name.endsWith(".txt") || f.name.endsWith(".json"))) {
                const c = await fetch(f.download_url);
                const d = await c.json();
                if (d.songs) globalData = globalData.concat(d.songs);
            }
        }
        let allInstr = [...new Set(globalData.flatMap(s => s.instruments))];
        allInstr.sort().forEach(ins => $('#instrContainer').append(`<span class="instr-tag" onclick="toggleInstr('${ins}', this)">${ins}</span>`));
        [...new Set(globalData.map(s => s.genre))].sort().forEach(t => $('#genreFilter').append(`<option value="${t}">${t}</option>`));
        updateLangUI();
    }

    function renderTable() {
        $('#anaTablo').DataTable({
            data: globalData, destroy: true,
            columns: [
                { data: "name", render: d => `<b>${d}</b>` }, { data: "genre" },
                { data: "musicQuality", render: d => `<span class="score-box" style="${getRainbowStyle(d)}">${d}</span>` },
                { data: "lyricsQuality", render: d => `<span class="score-box" style="${getRainbowStyle(d)}">${d}</span>` },
                { data: "originality", render: d => `<span class="score-box" style="${getRainbowStyle(d)}">${d}</span>` },
                { data: "instruments", render: d => d.map(i => `<small class="instr-tag" style="cursor:default">${i}</small>`).join('') },
                { data: "price", render: d => `<b>${d}M</b>` },
                { data: "isHit", render: d => d ? '<span class="hit-badge">HIT</span>' : 'N' },
                { data: "writer" }, { data: "id" },
                { data: null, orderable: false, render: (d, t, r) => `<button onclick="addToCart('${r.id}')" style="cursor:pointer; background:var(--primary); border:none; color:white; border-radius:4px;">➕</button>` }
            ],
            language: { url: currentLang === 'tr' ? "//cdn.datatables.net/plug-ins/1.13.6/i18n/tr.json" : "" },
            order: [[9, "desc"]]
        });
    }

    function renderCards() {
        const container = $('#cardContainer').empty();
        globalData.forEach(s => {
            container.append(`
                <div class="song-card" data-id="${s.id}">
                    <div style="font-size:10px; color:#94a3b8; display:flex; justify-content:space-between;"><span>ID: ${s.id}</span><span>${s.writer}</span></div>
                    <h4 style="margin:10px 0;">${s.name}</h4>
                    <div style="font-size:11px; margin-bottom:15px; background:var(--bg); padding:8px; border-radius:8px; display:flex; gap:5px; justify-content:center;">
                        <span class="score-box" style="${getRainbowStyle(s.musicQuality)}">${s.musicQuality}</span>
                        <span class="score-box" style="${getRainbowStyle(s.lyricsQuality)}">${s.lyricsQuality}</span>
                        <span class="score-box" style="${getRainbowStyle(s.originality)}">${s.originality}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="color:var(--primary); font-size:18px;">${s.price}M</b>
                        <button onclick="addToCart('${s.id}')" style="background:#43b581; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Add</button>
                    </div>
                </div>
            `);
        });
    }

    function addToCart(id) {
        const song = globalData.find(s => s.id == id);
        if (song && !selectedSongs.find(s => s.id == id)) { selectedSongs.push(song); updateCartUI(); }
    }

    function updateCartUI() {
        $('#cartCount').text(selectedSongs.length);
        const list = $('#cartItems').empty();
        selectedSongs.forEach(s => list.append(`<li class="cart-item"><span>${s.name}</span> <button onclick="removeFromCart('${s.id}')" style="background:none; border:none; color:#ff4757; cursor:pointer;">X</button></li>`));
    }

    function removeFromCart(id) { selectedSongs = selectedSongs.filter(s => s.id != id); updateCartUI(); }

    function copyCart() {
        if (selectedSongs.length === 0) return alert(LANG[currentLang].cart_empty);
        let text = LANG[currentLang].msg_head + ":\n\n";
        selectedSongs.forEach(s => {
            text += `🔹 [songid=${s.id} name=${s.name}] (${LANG[currentLang].msg_writer}: ${s.writer} | ${LANG[currentLang].msg_price}: ${s.price}M)\n`;
        });
        navigator.clipboard.writeText(text).then(() => alert(LANG[currentLang].msg_copied));
    }

    function toggleInstr(ins, el) {
        $(el).toggleClass('selected');
        if (selectedInstr.includes(ins)) selectedInstr = selectedInstr.filter(i => i !== ins);
        else selectedInstr.push(ins);
        const regex = selectedInstr.map(i => `(?=.*${i})`).join('');
        $('#anaTablo').DataTable().column(5).search(regex, true, false).draw();
    }

    function toggleView(v) {
        $('.view-btn').removeClass('active-view');
        if(v === 'table') { $('#tableWrapper').fadeIn(); $('#cardContainer').hide(); $('#btnTable').addClass('active-view'); }
        else { $('#tableWrapper').hide(); $('#cardContainer').css('display', 'grid').fadeIn(); $('#btnCards').addClass('active-view'); }
    }

    baslat();
    </script>
</body>
</html>
