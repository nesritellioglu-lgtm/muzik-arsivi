<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>🎵 SongMaster Arşivi</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        /* GECE MODU & GENEL STİL */
        body { background-color: #0f111a; color: #e0e6ed; font-family: 'Inter', sans-serif; padding: 20px; }
        .stats-panel { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1a1d2e; padding: 15px; border-radius: 12px; border-bottom: 3px solid #7289da; min-width: 120px; text-align: center; }
        .stat-card h3 { font-size: 11px; color: #94a3b8; margin: 0; text-transform: uppercase; }
        .stat-card p { font-size: 22px; font-weight: bold; margin: 5px 0 0; color: #7289da; }

        .controls { background: #1a1d2e; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        button.view-btn { background: #7289da; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        
        /* KART GÖRÜNÜMÜ STİLLERİ */
        #cardContainer { display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .song-card { background: #1a1d2e; border-radius: 12px; padding: 20px; border: 1px solid #2d334a; transition: 0.3s; position: relative; }
        .song-card:hover { transform: translateY(-5px); border-color: #7289da; }
        .song-card h4 { margin: 0 0 10px 0; color: #fff; font-size: 18px; }
        .song-card .meta { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
        .song-card .scores { display: flex; justify-content: space-between; background: #0f111a; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .score-item { text-align: center; }
        .score-val { display: block; font-weight: bold; color: #7289da; }
        .score-lbl { font-size: 10px; color: #64748b; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        
        /* TABLO GECE MODU */
        table.dataTable { background: #1a1d2e !important; color: #e0e6ed !important; }
        .dataTables_wrapper .dataTables_filter input { background: #0f111a; color: white; border: 1px solid #2d334a; border-radius: 6px; }
        .hit-badge { background: #f87171; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .instr-tag { background: #334155; color: #cbd5e1; padding: 2px 5px; border-radius: 4px; font-size: 10px; margin-right: 3px; }
    </style>
</head>
<body>

    <div class="stats-panel">
        <div class="stat-card"><h3>Arşiv</h3><p id="s-total">0</p></div>
        <div class="stat-card"><h3>🔥 HIT</h3><p id="s-hit">0</p></div>
        <div class="stat-card"><h3>Ort. Fiyat</h3><p id="s-price">0M</p></div>
    </div>

    <div class="controls">
        <button class="view-btn" onclick="toggleView('table')">📋 Tablo Görünümü</button>
        <button class="view-btn" onclick="toggleView('cards')" style="background:#4752c4;">🎴 Kart Görünümü</button>
        <select id="genreFilter" style="background:#0f111a; color:white; padding:7px; border-radius:6px; border:1px solid #2d334a;"><option value="">Tüm Türler</option></select>
        <label><input type="checkbox" id="hitFilter"> Sadece HIT</label>
    </div>

    <div id="tableWrapper">
        <table id="anaTablo" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th><th>Şarkı</th><th>Yazar</th><th>Tür</th><th>Müzik</th><th>Söz</th><th>Özgün</th><th>Fiyat</th><th>Durum</th>
                </tr>
            </thead>
        </table>
    </div>

    <div id="cardContainer"></div>

    <script>
    let globalData = [];
    const kullanici = "nesritellioglu-lgtm"; 
    const repo = "muzik-arsivi";

    async function baslat() {
        const res = await fetch(`https://api.github.com/repos/${kullanici}/${repo}/contents/`);
        const dosyalar = await res.json();
        
        for (let f of dosyalar) {
            if (f.name.includes("JSON") && (f.name.endsWith(".txt") || f.name.endsWith(".json"))) {
                const c = await fetch(f.download_url);
                const d = await c.json();
                globalData = globalData.concat(d.songs);
            }
        }

        // İstatistikleri Güncelle 
        $('#s-total').text(globalData.length);
        $('#s-hit').text(globalData.filter(s => s.isHit).length);
        const avg = (globalData.reduce((a, b) => a + b.price, 0) / globalData.length).toFixed(1);
        $('#s-price').text(avg + "M");

        // Türleri Doldur
        [...new Set(globalData.map(s => s.genre))].forEach(t => $('#genreFilter').append(`<option value="${t}">${t}</option>`));

        renderTable();
        renderCards();
    }

    function renderTable() {
        $('#anaTablo').DataTable({
            data: globalData,
            columns: [
                { data: "id" }, [cite: 5]
                { data: "name", render: d => `<b>${d}</b>` }, [cite: 5]
                { data: "writer" }, [cite: 5]
                { data: "genre" }, [cite: 5]
                { data: "musicQuality" }, [cite: 5]
                { data: "lyricsQuality" }, [cite: 5]
                { data: "originality" }, [cite: 6]
                { data: "price", render: d => `${d}M` }, [cite: 5]
                { data: "isHit", render: d => d ? '<span class="hit-badge">HIT</span>' : 'N' } [cite: 5, 6]
            ],
            language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/tr.json" }
        });
    }

    function renderCards() {
        const container = $('#cardContainer');
        container.empty();
        globalData.forEach(s => {
            const card = `
                <div class="song-card" data-genre="${s.genre}" data-hit="${s.isHit}">
                    ${s.isHit ? '<span class="hit-badge" style="position:absolute; top:15px; right:15px;">🔥 HIT</span>' : ''}
                    <div class="meta">#${s.id} | ${s.writer}</div> [cite: 5]
                    <h4>${s.name}</h4> [cite: 5]
                    <div class="meta">🏷️ ${s.genre}</div> [cite: 5]
                    <div class="scores">
                        <div class="score-item"><span class="score-val">${s.musicQuality}</span><span class="score-lbl">MÜZİK</span></div> [cite: 5]
                        <div class="score-item"><span class="score-val">${s.lyricsQuality}</span><span class="score-lbl">SÖZ</span></div> [cite: 5]
                        <div class="score-item"><span class="score-val">${s.originality}</span><span class="score-lbl">ÖZGÜN</span></div> [cite: 6]
                    </div>
                    <div class="card-footer">
                        <span style="font-weight:bold; color:#7289da; font-size:20px;">${s.price}M</span> [cite: 5]
                        <div>${s.instruments.map(i => `<span class="instr-tag">${i}</span>`).join('')}</div> [cite: 5]
                    </div>
                </div>`;
            container.append(card);
        });
    }

    function toggleView(v) {
        if(v === 'table') { $('#tableWrapper').show(); $('#cardContainer').css('display', 'none'); }
        else { $('#tableWrapper').hide(); $('#cardContainer').css('display', 'grid'); }
    }

    // Filtreleme işlemleri buraya eklenebilir...
    baslat();
    </script>
</body>
</html>
