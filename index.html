<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>🎵 SongMaster Arşivi</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        body { background-color: #0f111a; color: #e0e6ed; font-family: 'Inter', sans-serif; padding: 20px; }
        .stats-panel { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1a1d2e; padding: 15px; border-radius: 12px; border-bottom: 3px solid #7289da; min-width: 120px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .stat-card h3 { font-size: 11px; color: #94a3b8; margin: 0; text-transform: uppercase; }
        .stat-card p { font-size: 22px; font-weight: bold; margin: 5px 0 0; color: #7289da; }

        .controls { background: #1a1d2e; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        button.view-btn { background: #7289da; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button.view-btn:hover { background: #5b70be; }
        
        #cardContainer { display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .song-card { background: #1a1d2e; border-radius: 12px; padding: 20px; border: 1px solid #2d334a; transition: 0.3s; position: relative; }
        .song-card:hover { transform: translateY(-5px); border-color: #7289da; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .song-card h4 { margin: 0 0 10px 0; color: #fff; font-size: 18px; }
        .song-card .meta { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
        .song-card .scores { display: flex; justify-content: space-between; background: #0f111a; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .score-val { display: block; font-weight: bold; color: #7289da; font-size: 16px; }
        .score-lbl { font-size: 10px; color: #64748b; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        
        table.dataTable { background: #1a1d2e !important; color: #e0e6ed !important; border-radius: 8px; overflow: hidden; }
        .dataTables_wrapper .dataTables_filter input { background: #0f111a; color: white; border: 1px solid #2d334a; border-radius: 6px; padding: 5px; }
        .hit-badge { background: #f87171; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .instr-tag { background: #334155; color: #cbd5e1; padding: 2px 5px; border-radius: 4px; font-size: 10px; margin-right: 3px; border: 1px solid #475569; }
    </style>
</head>
<body>

    <div class="stats-panel">
        <div class="stat-card"><h3>Toplam Arşiv</h3><p id="s-total">0</p></div>
        <div class="stat-card"><h3>🔥 HIT Şarkı</h3><p id="s-hit">0</p></div>
        <div class="stat-card"><h3>Ortalama Fiyat</h3><p id="s-price">0M</p></div>
    </div>

    <div class="controls">
        <button class="view-btn" onclick="toggleView('table')">📋 Tablo</button>
        <button class="view-btn" onclick="toggleView('cards')" style="background:#4752c4;">🎴 Kartlar</button>
        <select id="genreFilter" style="background:#0f111a; color:white; padding:8px; border-radius:6px; border:1px solid #2d334a;"><option value="">Tüm Türler</option></select>
        <label style="cursor:pointer;"><input type="checkbox" id="hitFilter"> Sadece HIT</label>
        <span id="loadingMsg" style="color: #7289da; font-weight: bold; display:none;">⌛ Yükleniyor...</span>
    </div>

    <div id="tableWrapper">
        <table id="anaTablo" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th><th>Şarkı</th><th>Yazar</th><th>Tür</th><th>Müzik</th><th>Söz</th><th>Özgün</th><th>Fiyat</th><th>Durum</th>
                </tr>
            </thead>
        </table>
    </div>

    <div id="cardContainer"></div>

    <script>
    let globalData = [];
    const kullanici = "nesritellioglu-lgtm"; 
    const repo = "muzik-arsivi";

    async function baslat() {
        $('#loadingMsg').show();
        try {
            // API'den dosyaları çek (t=... ile cache temizliği yapar)
            const res = await fetch(`https://api.github.com/repos/${kullanici}/${repo}/contents/?t=${new Date().getTime()}`);
            const dosyalar = await res.json();
            
            globalData = [];

            for (let f of dosyalar) {
                // İsmi ne olursa olsun içinde "JSON" geçen .txt veya .json dosyalarını oku
                if (f.name.toUpperCase().includes("JSON") && (f.name.endsWith(".txt") || f.name.endsWith(".json"))) {
                    const c = await fetch(f.download_url + `?t=${new Date().getTime()}`);
                    const d = await c.json();
                    if (d.songs) globalData = globalData.concat(d.songs);
                }
            }

            if(globalData.length > 0) {
                updateUI();
            } else {
                alert("Uyarı: Okunabilir şarkı verisi bulunamadı!");
            }
        } catch (err) {
            console.error("Hata:", err);
        }
        $('#loadingMsg').hide();
    }

    function updateUI() {
        // İstatistikler 
        $('#s-total').text(globalData.length);
        $('#s-hit').text(globalData.filter(s => s.isHit).length);
        const avg = (globalData.reduce((a, b) => a + b.price, 0) / globalData.length).toFixed(1);
        $('#s-price').text(avg + "M");

        // Türleri doldur
        const turler = [...new Set(globalData.map(s => s.genre))];
        $('#genreFilter').html('<option value="">Tüm Türler</option>');
        turler.forEach(t => $('#genreFilter').append(`<option value="${t}">${t}</option>`));

        renderTable();
        renderCards();
    }

    function renderTable() {
        if ($.fn.DataTable.isDataTable('#anaTablo')) $('#anaTablo').DataTable().destroy();
        
        const tablo = $('#anaTablo').DataTable({
            data: globalData,
            columns: [
                { data: "id" }, // [cite: 5]
                { data: "name", render: d => `<b>${d}</b>` }, // [cite: 5]
                { data: "writer" }, // [cite: 5]
                { data: "genre" }, // [cite: 5]
                { data: "musicQuality" }, // [cite: 5]
                { data: "lyricsQuality" }, // [cite: 5]
                { data: "originality" }, // [cite: 5]
                { data: "price", render: d => `${d}M` }, // [cite: 5]
                { data: "isHit", render: d => d ? '<span class="hit-badge">HIT</span>' : 'N' } // [cite: 5]
            ],
            language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/tr.json" },
            order: [[0, "desc"]]
        });

        $('#genreFilter').on('change', function() { tablo.column(3).search(this.value).draw(); });
        $('#hitFilter').on('change', function() { tablo.column(8).search(this.checked ? 'HIT' : '').draw(); });
    }

    function renderCards() {
        const container = $('#cardContainer');
        container.empty();
        globalData.forEach(s => {
            const card = `
                <div class="song-card">
                    ${s.isHit ? '<span class="hit-badge" style="position:absolute; top:15px; right:15px;">🔥 HIT</span>' : ''}
                    <div class="meta">ID: ${s.id} | Yazar: ${s.writer}</div>
                    <h4>${s.name}</h4>
                    <div class="meta">🏷️ ${s.genre}</div>
                    <div class="scores">
                        <div class="score-item"><span class="score-val">${s.musicQuality}</span><span class="score-lbl">MÜZİK</span></div>
                        <div class="score-item"><span class="score-val">${s.lyricsQuality}</span><span class="score-lbl">SÖZ</span></div>
                        <div class="score-item"><span class="score-val">${s.originality}</span><span class="score-lbl">ÖZGÜN</span></div>
                    </div>
                    <div class="card-footer">
                        <span style="font-weight:bold; color:#7289da; font-size:20px;">${s.price}M</span>
                        <div>${s.instruments.map(i => `<span class="instr-tag">${i}</span>`).join('')}</div>
                    </div>
                </div>`;
            container.append(card);
        });
    }

    function toggleView(v) {
        if(v === 'table') { $('#tableWrapper').fadeIn(); $('#cardContainer').hide(); }
        else { $('#tableWrapper').hide(); $('#cardContainer').css('display', 'grid').fadeIn(); }
    }

    baslat();
    </script>
</body>
</html>
