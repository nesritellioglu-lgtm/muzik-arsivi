<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SongMaster Database Manager</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        :root { --bg: #0d0e14; --panel: #161927; --text: #e0e6ed; --border: #2d334a; --primary: #7289da; --success: #43b581; --danger: #f04747; }
        [data-theme="light"] { --bg: #f2f3f5; --panel: #ffffff; --text: #2e3338; --border: #e3e5e8; --primary: #5865f2; --success: #3ba55c; }

        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }

        .server-selector { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
        .server-btn { flex: 1; padding: 6px; border: none; border-radius: 6px; background: none; color: var(--text); cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; }
        .server-btn.active { background: var(--primary); color: white; }

        .cart-box { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-top: auto; }
        .btn-copy { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }

        /* DATABASE SYNC PANEL */
        .db-sync-area { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        textarea#rawJsonInput { width: 100%; height: 120px; background: #000; color: #0f0; border: 1px solid var(--border); border-radius: 6px; font-family: monospace; padding: 10px; box-sizing: border-box; }
        .token-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }

        .score-box { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 4px; font-weight: bold; font-size: 11px; color: #fff; text-shadow: 1px 1px 1px #000; }
        table.dataTable { background: var(--panel) !important; color: var(--text) !important; font-size: 12px; }
        .song-link { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body data-theme="dark">

    <div class="sidebar">
        <h2 style="margin:0;">🎵 SongMaster</h2>
        
        <div style="display:flex; gap:5px;">
            <button class="server-btn" style="background:var(--bg); border:1px solid var(--border);" onclick="toggleTheme()">🌓 Theme</button>
            <button class="server-btn" style="background:var(--bg); border:1px solid var(--border);" onclick="toggleLang()">🌍 <span id="langDisplay">EN</span></button>
        </div>

        <div>
            <span style="font-size:10px; color:#94a3b8; font-weight:bold;">POP-SERVER</span>
            <div class="server-selector">
                <button class="server-btn active" onclick="setServer(73)">73</button>
                <button class="server-btn" onclick="setServer(74)">74</button>
                <button class="server-btn" onclick="setServer(75)">75</button>
            </div>
        </div>

        <div class="cart-box">
            <h4 style="margin:0;"><span data-key="cart_title">Selection</span> (<span id="cartCount">0</span>)</h4>
            <ul id="cartItems" style="padding:0; list-style:none; font-size:11px; margin:10px 0; max-height: 150px; overflow-y: auto;"></ul>
            <button class="btn-copy" onclick="copyCart()" data-key="btn_copy">Copy for Game</button>
        </div>
    </div>

    <div class="main-content">
        <div class="db-sync-area">
            <h3 style="margin:0 0 15px 0; color:var(--success);">🗄️ Database Quick-Sync</h3>
            <input type="password" id="ghToken" class="token-input" placeholder="GitHub Personal Access Token (Required for Auto-Push)" onchange="saveToken()">
            <textarea id="rawJsonInput" placeholder="Paste your parsed JSON here (Single song object or Array)"></textarea>
            <div style="margin-top:10px; display:flex; gap:10px;">
                <button onclick="pushToDatabase()" style="flex:1; padding:10px; background:var(--success); border:none; color:white; border-radius:6px; font-weight:bold; cursor:pointer;">Push to GitHub Database</button>
                <button onclick="localStorage.removeItem('gh_token'); $('#ghToken').val('');" style="background:var(--danger); border:none; color:white; padding:10px; border-radius:6px; cursor:pointer;">Clear Token</button>
            </div>
            <div id="syncStatus" style="margin-top:10px; font-size:12px; font-weight:bold;"></div>
        </div>

        <table id="anaTablo" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>Song</th><th>Genre</th><th>M</th><th>L</th><th>O</th><th>Instr.</th><th>Price</th><th>Writer</th><th>ID</th><th>🛒</th>
                </tr>
            </thead>
        </table>
    </div>

    <script>
    const RAINBOW = [['#ff0000','#fff'],['#ff0036','#fff'],['#ff006c','#fff'],['#ff00a2','#fff'],['#ff00d8','#fff'],['#f000ff','#fff'],['#ba00ff','#fff'],['#8400ff','#fff'],['#4e00ff','#fff'],['#1900ff','#fff'],['#001dff','#fff'],['#0053ff','#fff'],['#0089ff','#fff'],['#00bfff','#fff'],['#00f5ff','#000'],['#00ffd3','#000'],['#00ff9d','#000'],['#00ff67','#000'],['#00ff31','#000'],['#05ff00','#000'],['#3bff00','#000'],['#71ff00','#000'],['#a7ff00','#000'],['#ddff00','#000'],['#ffeb00','#000'],['#ffb500','#000'],['#ff8000','#000']];
    let currentLang = 'en', globalData = [], selectedSongs = [], activeServer = 73;
    const user = "nesritellioglu-lgtm", repo = "muzik-arsivi", fileName = "muzikler.json", charId = "780798";

    const LANGS = {
        tr: { cart_title: "Seçilenler", btn_copy: "Kopyala", msg_head: "İlgilendiğim şarkılar", msg_writer: "Yazar", msg_price: "Fiyat", msg_order: "Sipariş için mesaj atın:" },
        en: { cart_title: "My Selection", btn_copy: "Copy Selection", msg_head: "Songs I'm interested in", msg_writer: "Writer", msg_price: "Price", msg_order: "Send a message for order:" }
    };

    function getRainbow(v) { let idx = Math.min(Math.max(parseInt(v) || 0, 0), 26); return `background:${RAINBOW[idx][0]}; color:${RAINBOW[idx][1]};`; }
    function setServer(s) { activeServer = s; $('.server-btn').removeClass('active'); event.target.classList.add('active'); renderTable(); }
    function toggleTheme() { $('body').attr('data-theme', $('body').attr('data-theme') === 'dark' ? 'light' : 'dark'); }
    function toggleLang() { currentLang = currentLang === 'en' ? 'tr' : 'en'; $('#langDisplay').text(currentLang.toUpperCase()); renderTable(); }
    function saveToken() { localStorage.setItem('gh_token', $('#ghToken').val()); }

    async function init() {
        $('#ghToken').val(localStorage.getItem('gh_token') || '');
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${fileName}?t=${Date.now()}`);
        const data = await res.json();
        const content = JSON.parse(atob(data.content));
        globalData = content.songs || [];
        renderTable();
    }

    function renderTable() {
        if ($.fn.DataTable.isDataTable('#anaTablo')) $('#anaTablo').DataTable().destroy();
        $('#anaTablo').DataTable({
            data: globalData,
            columns: [
                { data: "name", render: d => `<b>${d}</b>` },
                { data: "genre" },
                { data: "musicQuality", render: d => `<span class="score-box" style="${getRainbow(d)}">${d}</span>` },
                { data: "lyricsQuality", render: d => `<span class="score-box" style="${getRainbow(d)}">${d}</span>` },
                { data: "originality", render: d => `<span class="score-box" style="${getRainbow(d)}">${d}</span>` },
                { data: "instruments", render: d => d.map(i => `<small style="font-size:9px; border:1px solid var(--border); padding:1px 3px; margin:1px; border-radius:3px;">${i}</small>`).join('') },
                { data: "price", render: d => `<b>${d}M</b>` },
                { data: "writer" },
                { data: "id", render: d => `<a href="https://${activeServer}.popmundo.com/World/Popmundo.aspx/Songs/Song/${d}" target="_blank" class="song-link">${d}</a>` },
                { data: null, orderable: false, render: (d,t,r) => `<button onclick="addToCart('${r.id}')" style="background:var(--primary); color:white; border:none; border-radius:4px; cursor:pointer; padding:2px 6px;">+</button>` }
            ],
            order: [[8, "desc"]], pageLength: 15
        });
    }

    function addToCart(id) {
        const s = globalData.find(x => x.id == id);
        if (s && !selectedSongs.find(x => x.id == id)) { selectedSongs.push(s); updateCart(); }
    }

    function updateCart() {
        $('#cartCount').text(selectedSongs.length);
        const list = $('#cartItems').empty();
        selectedSongs.forEach(s => list.append(`<li style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.1);"><span>${s.name}</span> <span onclick="removeFromCart('${s.id}')" style="cursor:pointer; color:var(--danger); font-weight:bold;">×</span></li>`));
    }

    function removeFromCart(id) { selectedSongs = selectedSongs.filter(s => s.id != id); updateCart(); }

    function copyCart() {
        if (selectedSongs.length === 0) return;
        let l = LANGS[currentLang];
        let msg = l.msg_head + ":\n";
        selectedSongs.forEach(s => {
            msg += `🔹 [songid=${s.id} name=${s.name}] ${s.genre} ${s.musicQuality} ${s.lyricsQuality} ${s.originality} (${l.msg_writer}: ${s.writer} | ${l.msg_price}: ${s.price}M)\n`;
        });
        msg += `\n${l.msg_order}\nhttps://${activeServer}.popmundo.com/World/Popmundo.aspx/Conversations/Conversation/${charId}`;
        navigator.clipboard.writeText(msg).then(() => alert("Kopyalandı!"));
    }

    // DATABASE PUSH LOGIC
    async function pushToDatabase() {
        const token = $('#ghToken').val();
        const rawInput = $('#rawJsonInput').val();
        if (!token) return alert("GitHub Token is missing!");
        if (!rawInput) return alert("Paste JSON data first!");

        $('#syncStatus').text("Connecting to GitHub...").css("color", "var(--primary)");

        try {
            // 1. Get Current File Info (SHA is needed to update)
            const getRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${fileName}`, {
                headers: { "Authorization": `token ${token}` }
            });
            const fileData = await getRes.json();
            const currentSha = fileData.sha;
            let currentContent = JSON.parse(atob(fileData.content));

            // 2. Parse New Input
            let newData = JSON.parse(rawInput);
            if (!Array.isArray(newData)) newData = [newData]; // Convert single object to array

            // 3. Merge (Add unique IDs only)
            const existingIds = new Set(currentContent.songs.map(s => s.id));
            newData.forEach(s => {
                if (!existingIds.has(s.id)) currentContent.songs.push(s);
            });

            // 4. Push back to GitHub
            const pushRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${fileName}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Database Update: Added ${newData.length} songs`,
                    content: btoa(JSON.stringify(currentContent, null, 2)),
                    sha: currentSha
                })
            });

            if (pushRes.ok) {
                $('#syncStatus').text("✅ Success! Database updated.").css("color", "var(--success)");
                $('#rawJsonInput').val('');
                globalData = currentContent.songs;
                renderTable();
            } else {
                throw new Error("Push failed");
            }
        } catch (err) {
            console.error(err);
            $('#syncStatus').text("❌ Error: " + err.message).css("color", "var(--danger)");
        }
    }

    init();
    </script>
</body>
</html>
