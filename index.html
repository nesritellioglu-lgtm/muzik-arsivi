<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SongMaster Market</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        :root { --bg: #0d0e14; --panel: #161927; --text: #e0e6ed; --border: #2d334a; --primary: #7289da; --success: #43b581; --admin: #ff4757; }
        [data-theme="light"] { --bg: #f0f2f5; --panel: #ffffff; --text: #1c1e21; --border: #ccd0d5; --primary: #4752c4; --success: #2e7d32; }

        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 15px; }
            .main-content { padding: 15px; }
            .stat-group { grid-template-columns: 1fr 1fr 1fr 1fr; }
            .server-selector { flex-wrap: wrap; }
            #cardContainer { grid-template-columns: 1fr; }
        }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .main-content { flex: 1; padding: 25px; overflow-y: auto; position: relative; }

        .server-selector { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
        .server-btn { flex: 1; padding: 6px; border: none; border-radius: 6px; background: none; color: var(--text); cursor: pointer; font-weight: bold; font-size: 11px; }
        .server-btn.active { background: var(--primary); color: white; }

        /* SEPET VE İSTATİSTİK */
        .cart-box { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-top: auto; }
        .stat-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-card { background: var(--bg); padding: 8px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }

        /* GİZLİ ADMİN PANELİ */
        #adminPanel { display: none; background: var(--panel); border: 2px solid var(--admin); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        textarea#rawJson { width: 100%; height: 100px; background: #000; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; box-sizing: border-box; }

        /* TABLO VE KARTLAR */
        .score-box { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 4px; font-weight: bold; font-size: 11px; color: #fff; text-shadow: 1px 1px 1px #000; }
        #cardContainer { display: none; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 20px; }
        .song-card { background: var(--panel); border-radius: 10px; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        
        .instr-tag { background: var(--bg); color: var(--primary); padding: 1px 5px; border-radius: 4px; font-size: 9px; border: 1px solid var(--border); display: inline-block; margin: 1px; }
        .instr-tag.selectable { cursor: pointer; }
        .instr-tag.selected { background: var(--primary); color: white; }
    </style>
</head>
<body data-theme="light">

    <div class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; font-size: 20px;">🎵 SongMaster</h2>
            <button onclick="$('#adminPanel').slideToggle()" style="background:none; border:none; color:var(--text); cursor:pointer; font-size:18px;">⚙️</button>
        </div>
        
        <div style="display:flex; gap:5px;">
            <button class="server-btn active" style="border:1px solid var(--border);" onclick="setLang('tr')" id="langTR">🇹🇷  TR</button>
            <button class="server-btn" style="border:1px solid var(--border);" onclick="setLang('en')" id="langEN">🇬🇧 EN</button>
            <button class="server-btn" style="border:1px solid var(--border);" onclick="setTheme('light')" id="btnLight">☀️ Light</button>
            <button class="server-btn" style="border:1px solid var(--border);" onclick="setTheme('dark')" id="btnDark">🌙 Dark</button>
        </div>

        <div>
            <span style="font-size:10px; color:#94a3b8; font-weight:bold;">POP-SERVER</span>
            <div class="server-selector">
                <button class="server-btn active" onclick="setServer(73)">73</button>
                <button class="server-btn" onclick="setServer(74)">74</button>
                <button class="server-btn" onclick="setServer(75)">75</button>
            </div>
        </div>

        <div class="stat-group">
            <div class="stat-card"><h3 style="font-size:9px; margin:0;" data-key="total">Toplam</h3><p id="s-total" style="margin:4px 0; font-weight:bold;">0</p></div>
            <div class="stat-card"><h3 style="font-size:9px; margin:0;" data-key="hit">HIT</h3><p id="s-hit" style="margin:4px 0; font-weight:bold;">0</p></div>
        </div>

        <div style="background:var(--bg); padding:10px; border-radius:10px; border:1px solid var(--border);">
            <input type="text" id="searchInput" placeholder="Şarkı, yazar veya tür ara..." style="width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px; margin-bottom:8px; font-size:12px;">
            <select id="genreFilter" style="width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px; font-size:12px;"><option value="">Tüm Türler</option></select>
            
            <div style="display:flex; gap:4px; margin-top:8px;">
                <label style="display:flex; align-items:center; gap:4px; font-size:10px; cursor:pointer;">
                    <input type="checkbox" id="hitOnly" style="cursor:pointer;">
                    <span data-key="hit_only">Sadece HIT</span>
                </label>
            </div>
            
            <div style="margin-top:8px;">
                <span style="font-size:10px; font-weight:bold;" data-key="min_quality">Min Kalite:</span>
                <div style="display:flex; gap:4px; margin-top:4px;">
                    <input type="number" id="minMusic" min="21" max="26" placeholder="M" style="width:50px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:2px; font-size:10px; text-align:center;">
                    <input type="number" id="minLyrics" min="21" max="26" placeholder="L" style="width:50px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:2px; font-size:10px; text-align:center;">
                    <button onclick="applyFilters()" style="flex:1; background:var(--primary); color:white; border:none; border-radius:3px; padding:2px 6px; font-size:9px; cursor:pointer;" data-key="apply">Uygula</button>
                    <button onclick="resetFilters()" style="flex:1; background:var(--admin); color:white; border:none; border-radius:3px; padding:2px 6px; font-size:9px; cursor:pointer;" data-key="reset">Sıfırla</button>
                </div>
            </div>
            
            <div id="instrContainer" style="margin-top:10px;"></div>
        </div>

        <div class="cart-box">
            <h4 style="margin:0;"><span data-key="cart_title">Seçimler</span> (<span id="cartCount">0</span>)</h4>
            <ul id="cartItems" style="padding:0; list-style:none; font-size:11px; margin:10px 0; max-height: 120px; overflow-y:auto;"></ul>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:11px; font-weight:bold;" data-key="total_price">Toplam Ücret:</span>
                <span id="totalPrice" style="font-size:11px; font-weight:bold; color:#ffd700;">0M</span>
            </div>
            <button onclick="purchaseCart()" style="background:var(--success); color:white; border:none; padding:10px; border-radius:8px; cursor:pointer; width:100%; font-weight:bold;" data-key="purchase">Satın Al</button>
        </div>
    </div>

    <div class="main-content">
        <div id="adminPanel">
            <h4 style="margin:0 0 10px 0; color:var(--admin);">Admin: Database Sync</h4>
            <input type="password" id="ghToken" placeholder="GitHub Token" style="width:100%; padding:8px; margin-bottom:10px; border-radius:5px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
            <div style="margin-bottom:10px;">
                <button onclick="pasteFromClipboard()" style="width:100%; padding:8px; background:var(--success); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin-bottom:5px;">📋 Paste from SongMaster</button>
                <button onclick="importFromCSV()" style="width:100%; padding:8px; background:var(--primary); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin-bottom:5px;">📁 Import CSV</button>
                <button onclick="exportToCSV()" style="width:100%; padding:8px; background:var(--primary); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin-bottom:5px;">💾 Export CSV</button>
                <button onclick="clearJson()" style="width:100%; padding:6px; background:var(--admin); color:white; border:none; border-radius:5px; font-size:11px; cursor:pointer;">🗑️ Clear Data</button>
            </div>
            <textarea id="rawJson" placeholder="CSV veya JSON verisini buraya yapıştırın..."></textarea>
            <button onclick="pushToDB()" style="margin-top:10px; width:100%; padding:10px; background:var(--admin); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">DATABASE GÜNCELLE / SYNC</button>
            <div id="syncLog" style="font-size:10px; margin-top:5px;"></div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button id="btnTable" class="server-btn active" style="flex:none; width:80px;" onclick="toggleView('table')" data-key="table">📋 Tablo</button>
            <button id="btnCards" class="server-btn" style="flex:none; width:80px;" onclick="toggleView('cards')" data-key="cards">🎴 Kartlar</button>
        </div>

        <div id="tableWrapper">
            <table id="anaTablo" class="display" style="width:100%">
                <thead>
                    <tr><th data-key="song">Şarkı</th><th data-key="genre">Tür</th><th data-key="music">M</th><th data-key="lyrics">L</th><th data-key="originality">O</th><th data-key="instruments">Instr.</th><th data-key="price">Fiyat</th><th data-key="writer">Yazar</th><th data-key="id">ID</th><th>🛒</th></tr>
                </thead>
            </table>
        </div>
        <div id="cardContainer"></div>
    </div>

    <script>
    const translations = {
        tr: { cart_title: 'Seçimler', total: 'Toplam', hit: 'HIT', all_genres: 'Tüm Türler', purchase: 'Satın Al', purchase_confirm: 'Siparişiniz panoya kopyalandı. Satıcıya mesaj atmak ister misiniz?', yes: 'Tamam', no: 'İptal', total_price: 'Toplam Ücret:', song: 'Şarkı', genre: 'Tür', music: 'Müzik', lyrics: 'Sözler', originality: 'Özgünlük', instruments: 'Enstrumanlar', price: 'Fiyat', writer: 'Yazar', id: 'ID', hit_only: 'Sadece HIT', min_quality: 'Min Kalite', search_placeholder: 'Şarkı, yazar veya tür ara...', reset: 'Sıfırla', table: 'Tablo', cards: 'Kartlar', add: 'Ekle', apply: 'Uygula', theme: 'Tema' },
        en: { cart_title: 'Selection', total: 'Total', hit: 'HIT', all_genres: 'All Genres', purchase: 'Purchase', purchase_confirm: 'Your order has been copied to clipboard. Would you like to message seller?', yes: 'OK', no: 'Cancel', total_price: 'Total Price:', song: 'Song', genre: 'Genre', music: 'Music', lyrics: 'Lyrics', originality: 'Originality', instruments: 'Instr.', price: 'Price', writer: 'Writer', id: 'ID', hit_only: 'Hit Only', min_quality: 'Min Quality', search_placeholder: 'Search song, writer or genre...', reset: 'Reset', table: 'Table', cards: 'Cards', add: 'Add', apply: 'Apply', theme: 'Theme' }
    };
    const RAINBOW = [['#ff0000','#fff'],['#ff0036','#fff'],['#ff006c','#fff'],['#ff00a2','#fff'],['#ff00d8','#fff'],['#f000ff','#fff'],['#ba00ff','#fff'],['#8400ff','#fff'],['#4e00ff','#fff'],['#1900ff','#fff'],['#001dff','#fff'],['#0053ff','#fff'],['#0089ff','#fff'],['#00bfff','#fff'],['#00f5ff','#000'],['#00ffd3','#000'],['#00ff9d','#000'],['#00ff67','#000'],['#00ff31','#000'],['#05ff00','#000'],['#3bff00','#000'],['#71ff00','#000'],['#a7ff00','#000'],['#ddff00','#000'],['#ffeb00','#000'],['#ffb500','#000'],['#ff8000','#000']];
    let currentLang = 'tr', globalData = [], selectedSongs = [], selectedInstr = [], activeServer = 73;
    const user = "nesritellioglu-lgtm", repo = "muzik-arsivi", charId = "780798";

    function getRainbow(v) { let idx = Math.min(Math.max(parseInt(v)||0,0),26); return `background:${RAINBOW[idx][0]}; color:${RAINBOW[idx][1]};`; }
    function setServer(s) { activeServer = s; $('.server-selector .server-btn').removeClass('active'); event.target.classList.add('active'); renderAll(); }
    function setTheme(theme) { 
        $('body').attr('data-theme', theme);
        
        // Buton active durumlarını güncelle
        $('#btnLight').removeClass('active');
        $('#btnDark').removeClass('active');
        
        if (theme === 'light') {
            $('#btnLight').addClass('active');
        } else {
            $('#btnDark').addClass('active');
        }
    }
    function toggleTheme() { $('body').attr('data-theme', $('body').attr('data-theme')==='dark'?'light':'dark'); }
    function setLang(lang) { 
        currentLang = lang;
        
        // Buton active durumlarını güncelle
        $('#langTR').removeClass('active');
        $('#langEN').removeClass('active');
        
        if (lang === 'tr') {
            $('#langTR').addClass('active');
        } else {
            $('#langEN').addClass('active');
        }
        
        updateTranslations(); 
        renderAll(); 
    }
    
    // Varsayılan ayarları uygula
    $(document).ready(function() {
        setLang('tr');
        setTheme('light');
        updateTranslations();
    });
    
    function updateTranslations() {
        const t = translations[currentLang];
        $('[data-key]').each(function() {
            const key = $(this).attr('data-key');
            if (t[key]) $(this).text(t[key]);
        });
        $('#genreFilter').find('option:first').text(t.all_genres);
        $('.cart-box button').text(t.purchase);
        $('#searchInput').attr('placeholder', t.search_placeholder);
        renderAll(); // Tabloyu yenile
    }

    async function init() {
        $('#ghToken').val(localStorage.getItem('gh_token') || '');
        try {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/?t=${Date.now()}`);
            const files = await res.json();
            globalData = [];
            for (let f of files) {
                if (f.name.toLowerCase().includes("json")) {
                    const c = await fetch(f.download_url);
                    const d = await c.json();
                    if (d.songs) globalData = globalData.concat(d.songs);
                }
            }
            $('#s-total').text(globalData.length);
            $('#s-hit').text(globalData.filter(s=>s.isHit).length);
            
            // Filtreleri doldur
            let allIns = [...new Set(globalData.flatMap(s=>s.instruments))].sort();
            $('#instrContainer').empty();
            allIns.forEach(i => $('#instrContainer').append(`<span class="instr-tag selectable" onclick="toggleInstr('${i}', this)">${i}</span>`));
            
            $('#genreFilter').html(`<option value="">${translations[currentLang].all_genres}</option>`);
            [...new Set(globalData.map(s=>s.genre))].sort().forEach(g => $('#genreFilter').append(`<option value="${g}">${g}</option>`));

            renderAll();
        } catch(e) { console.error("Hata:", e); }
    }

    function renderAll() { renderTable(); renderCards(); }

    function renderTable() {
        if ($.fn.DataTable.isDataTable('#anaTablo')) $('#anaTablo').DataTable().destroy();
        
        let filteredData = globalData;
        
        // Hit only filtresi
        if ($('#hitOnly').is(':checked')) {
            filteredData = filteredData.filter(s => s.isHit);
        }
        
        // Min kalite filtresi
        const minMusic = parseInt($('#minMusic').val()) || 0;
        const minLyrics = parseInt($('#minLyrics').val()) || 0;
        
        if (minMusic > 0) filteredData = filteredData.filter(s => s.musicQuality >= minMusic);
        if (minLyrics > 0) filteredData = filteredData.filter(s => s.lyricsQuality >= minLyrics);
        
        // Search filtresi
        const searchTerm = $('#searchInput').val().toLowerCase();
        if (searchTerm) {
            filteredData = filteredData.filter(s => 
                s.name.toLowerCase().includes(searchTerm) ||
                s.writer.toLowerCase().includes(searchTerm) ||
                s.genre.toLowerCase().includes(searchTerm)
            );
        }
        
        // Genre filtresi
        const selectedGenre = $('#genreFilter').val();
        if (selectedGenre) {
            filteredData = filteredData.filter(s => s.genre === selectedGenre);
        }
        
        const t = translations[currentLang];
        $('#anaTablo').DataTable({
            data: filteredData,
            columns: [
                { data: "name", render: d => `<b>${d}</b>` },
                { data: "genre" },
                { data: "musicQuality", render: d => `<span class="score-box" style="${getRainbow(d)}">${d}</span>` },
                { data: "lyricsQuality", render: d => `<span class="score-box" style="${getRainbow(d)}">${d}</span>` },
                { data: "originality", render: d => `<span class="score-box" style="${getRainbow(d)}">${d}</span>` },
                { data: "instruments", render: d => d.map(i=>`<span class="instr-tag">${i}</span>`).join('') },
                { data: "price", render: d => `<b>${d}M</b>` },
                { data: "writer" },
                { data: "id", render: d => `<a href="https://${activeServer}.popmundo.com/World/Popmundo.aspx/Character/Song/${d}" target="_blank" style="color:var(--primary); font-weight:bold;">${d}</a>` },
                { data: null, render: (d,t,r) => `<button onclick="addToCart('${r.id}')" style="background:var(--primary); color:white; border:none; border-radius:4px; padding:2px 6px; cursor:pointer;">+</button>` }
            ],
            order: [[8, "desc"]], pageLength: 15
        });
    }

    function renderCards() {
        const container = $('#cardContainer').empty();
        
        // Filtreleri uygula
        let filteredData = globalData;
        
        // Hit only filtresi
        if ($('#hitOnly').is(':checked')) {
            filteredData = filteredData.filter(s => s.isHit);
        }
        
        // Min kalite filtresi
        const minMusic = parseInt($('#minMusic').val()) || 0;
        const minLyrics = parseInt($('#minLyrics').val()) || 0;
        
        if (minMusic > 0) filteredData = filteredData.filter(s => s.musicQuality >= minMusic);
        if (minLyrics > 0) filteredData = filteredData.filter(s => s.lyricsQuality >= minLyrics);
        
        // Search filtresi
        const searchTerm = $('#searchInput').val().toLowerCase();
        if (searchTerm) {
            filteredData = filteredData.filter(s => 
                s.name.toLowerCase().includes(searchTerm) ||
                s.writer.toLowerCase().includes(searchTerm) ||
                s.genre.toLowerCase().includes(searchTerm)
            );
        }
        
        // Genre filtresi
        const selectedGenre = $('#genreFilter').val();
        if (selectedGenre) {
            filteredData = filteredData.filter(s => s.genre === selectedGenre);
        }
        
        filteredData.forEach(s => {
            container.append(`<div class="song-card" data-id="${s.id}">
                <div style="display:flex; justify-content:space-between; font-size:9px; color:#94a3b8;"><span>#${s.id}</span><span>${s.writer}</span></div>
                <h4 style="margin:2px 0;">${s.name} ${s.isHit?'🔥':''}</h4>
                <div style="display:flex; gap:3px;">
                    <span class="score-box" style="${getRainbow(s.musicQuality)}">${s.musicQuality}</span>
                    <span class="score-box" style="${getRainbow(s.lyricsQuality)}">${s.lyricsQuality}</span>
                    <span class="score-box" style="${getRainbow(s.originality)}">${s.originality}</span>
                </div>
                <div style="font-size:10px; margin-top:4px;">🏷️ ${s.genre}</div>
                <div style="font-size:9px; color:var(--text); margin-top:2px;">🎸 ${s.instruments ? s.instruments.join(', ') : ''}</div>
                <div style="margin-top:auto; display:flex; justify-content:space-between; align-items:center;">
                    <b style="color:var(--primary)">${s.price}M</b>
                    <button onclick="addToCart('${s.id}')" style="background:var(--success); color:white; border:none; border-radius:5px; padding:4px 8px; cursor:pointer;" data-key="add">Ekle</button>
                </div>
            </div>`);
        });
    }

    function addToCart(id) {
        const s = globalData.find(x => x.id == id);
        if (s && !selectedSongs.find(x => x.id == id)) { selectedSongs.push(s); updateCart(); }
    }

    function updateCart() {
        $('#cartCount').text(selectedSongs.length);
        const list = $('#cartItems').empty();
        selectedSongs.forEach(s => list.append(`<li style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>${s.name}</span> <span onclick="removeFromCart('${s.id}')" style="cursor:pointer; color:red;">×</span></li>`));
        
        // Toplam ücret hesapla
        const totalPrice = selectedSongs.reduce((sum, s) => sum + (parseInt(s.price) || 0), 0);
        $('#totalPrice').text(totalPrice + 'M');
    }

    function removeFromCart(id) { selectedSongs = selectedSongs.filter(s => s.id != id); updateCart(); }

    function copyCart() {
        if (selectedSongs.length === 0) return;
        let msg = (currentLang==='tr'?'İlgilendiğim şarkılar:':'Songs I\'m interested in:') + "\n";
        selectedSongs.forEach(s => {
            msg += `🔹 [songid=${s.id} name=${s.name}] ${s.genre} ${s.musicQuality} ${s.lyricsQuality} ${s.originality} (${currentLang==='tr'?'Yazar':'Writer'}: ${s.writer} | ${currentLang==='tr'?'Fiyat':'Price'}: ${s.price}M)\n`;
        });
        const totalPrice = selectedSongs.reduce((sum, s) => sum + (parseInt(s.price) || 0), 0);
        msg += `\n${currentLang==='tr'?'Toplam Ücret':'Total Price'}: ${totalPrice}M`;
        navigator.clipboard.writeText(msg);
        return msg;
    }
    
    function purchaseCart() {
        if (selectedSongs.length === 0) return;
        const msg = copyCart();
        const t = translations[currentLang];
        
        if (confirm(t.purchase_confirm)) {
            window.open(`https://${activeServer}.popmundo.com/World/Popmundo.aspx/Conversations/Conversation/${charId}`, '_blank');
        }
    }

    function toggleView(v) {
        $('.server-btn').removeClass('active');
        if(v === 'table') { $('#tableWrapper').show(); $('#cardContainer').hide(); $('#btnTable').addClass('active'); }
        else { $('#tableWrapper').hide(); $('#cardContainer').css('display', 'grid'); $('#btnCards').addClass('active'); }
    }

    function toggleInstr(ins, el) {
        $(el).toggleClass('selected');
        selectedInstr = $('.instr-tag.selectable.selected').map((i, e) => $(e).text()).get();
        const regex = selectedInstr.map(i => `(?=.*${i})`).join('');
        $('#anaTablo').DataTable().column(5).search(regex, true, false).draw();
    }

    function resetFilters() {
        $('#searchInput').val('');
        $('#genreFilter').val('');
        $('#hitOnly').prop('checked', false);
        $('#minMusic').val('');
        $('#minLyrics').val('');

    // DATABASE PUSH (Senin parse ettiğin JSON/CSV'u GitHub'a atar)
    async function pushToDB() {
        const token = $('#ghToken').val();
        const rawData = $('#rawJson').val().trim();
        if(!token || !rawData) return alert("Missing Token or Data!");
        localStorage.setItem('gh_token', token);
        
        $('#syncLog').text("Updating...").css("color", "orange");
        try {
            const fileName = "muzikler.json";
            
            // Önce mevcut dosyayı kontrol et
            let currentContent = {songs:[]};
            try {
                const getRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${fileName}`, { headers: {"Authorization": `token ${token}`} });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    if(fileData.content) currentContent = JSON.parse(atob(fileData.content));
                }
            } catch(e) {
                console.log("File not found, creating new...");
            }
            
            // Veriyi parse et - CSV veya JSON formatı kontrolü
            let newData;
            try {
                // CSV formatı mı kontrol et
                if (rawData.includes(',') && rawData.includes('\n') && !rawData.trim().startsWith('{') && !rawData.trim().startsWith('[')) {
                    console.log('Detected CSV format');
                    newData = parseCSV(rawData);
                } else {
                    // JSON formatı - eski kod
                    let cleanJson = rawData.trim();
                    console.log('Detected JSON format');
                    
                    // SongMaster formatı için özel parsing
                    if (cleanJson.includes('"timestamp"') && cleanJson.includes('"songs":[')) {
                        console.log('Detected SongMaster format with timestamp');
                        const songsMatch = cleanJson.match(/"songs":\s*(\[[\s\S]*?\])/);
                        if (songsMatch) {
                            cleanJson = '{"songs":' + songsMatch[1] + '}';
                        } else {
                            throw new Error('Could not extract songs array from SongMaster format');
                        }
                    } else if (cleanJson.includes('"songs":[')) {
                        console.log('Detected simple songs array format');
                        const match = cleanJson.match(/"songs":\s*(\[[\s\S]*?\])/);
                        if (match) {
                            cleanJson = match[0];
                        } else {
                            throw new Error('Could not extract songs array');
                        }
                    } else if (cleanJson.startsWith('[') && cleanJson.endsWith(']')) {
                        console.log('Detected direct array format');
                        cleanJson = '{"songs":' + cleanJson + '}';
                    } else if (cleanJson.startsWith('{') && cleanJson.endsWith('}')) {
                        console.log('Detected single object format');
                        cleanJson = '{"songs":[' + cleanJson + ']}';
                    } else {
                        console.log('Unknown format, trying direct parse');
                        cleanJson = '{"songs":' + cleanJson + '}';
                    }
                    
                    // Geçersiz karakterleri temizle
                    cleanJson = cleanJson.replace(/[\u0000-\u001F\u007F-\u009F]/g, '');
                    cleanJson = cleanJson.replace(/[\u2000-\u20FF\u2028-\u202F\u205F-\u206F\u3000-\u30FF\uFE00-\uFEFF\uFF00-\uFFFF]/g, '');
                    cleanJson = cleanJson.replace(/[\u201C\u201D\u2018\u2019]/g, '"');
                    cleanJson = cleanJson.replace(/[\u2013\u2014]/g, '-');
                    cleanJson = cleanJson.replace(/\s+/g, ' ');
                    cleanJson = cleanJson.replace(/^[\s,]+|[\s,]+$/g, '');
                    
                    const parsed = JSON.parse(cleanJson);
                    
                    if (parsed.songs && Array.isArray(parsed.songs)) {
                        newData = parsed.songs;
                    } else if (Array.isArray(parsed)) {
                        newData = parsed;
                    } else if (parsed.songs) {
                        newData = parsed.songs;
                    } else {
                        throw new Error('Invalid JSON structure - expected songs array');
                    }
                    
                    if(!Array.isArray(newData)) newData = [newData];
                }
                
                console.log('Parsed data count:', newData.length);
            } catch(e) {
                console.error('Parse Error:', e);
                throw new Error("Invalid format: " + e.message + "\n\nTip: CSV veya geçerli JSON formatı kullanın.");
            }

            // Yeni şarkıları ekle
            newData.forEach(s => { 
                if(!currentContent.songs.find(ex => ex.id == s.id)) {
                    // Gerekli alanları kontrol et
                    if(!s.id || !s.name) {
                        console.warn('Skipping invalid song:', s);
                        return;
                    }
                    // Eksik alanları varsayılan değerlerle doldur
                    if (!s.genre) s.genre = 'Unknown';
                    if (!s.musicQuality) s.musicQuality = 21;
                    if (!s.lyricsQuality) s.lyricsQuality = 21;
                    if (!s.originality) s.originality = 21;
                    if (!s.instruments) s.instruments = [];
                    if (!s.writer) s.writer = 'Unknown';
                    if (!s.price) s.price = 0;
                    if (!s.isHit) s.isHit = false;
                    
                    currentContent.songs.push(s); 
                }
            });

            // GitHub'a gönder
            const content = btoa(JSON.stringify(currentContent, null, 2));
            const body = {
                message: "Auto Sync: New Songs Added (CSV/JSON)",
                content: content
            };
            
            // Eğer dosya varsa sha ekle
            try {
                const getRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${fileName}`, { headers: {"Authorization": `token ${token}`} });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    body.sha = fileData.sha;
                }
            } catch(e) {
                // Yeni dosya, sha gerekmez
            }

            const pushRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${fileName}`, {
                method: "PUT",
                headers: {"Authorization": `token ${token}`, "Content-Type": "application/json"},
                body: JSON.stringify(body)
            });

            if(pushRes.ok) { 
                $('#syncLog').text("✅ Database Updated! Refreshing...").css("color", "lime"); 
                setTimeout(() => {
                    $('#rawJson').val('');
                    init();
                }, 2000); 
            } else {
                const errorData = await pushRes.json();
                throw new Error(errorData.message || 'Unknown error');
            }
        } catch(e) { 
            $('#syncLog').text("❌ Error: " + e.message).css("color", "red"); 
        }
    }

    init();

    // CSV Import
    async function importFromCSV() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.csv';
        input.onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            try {
                const text = await file.text();
                $('#rawJson').val(text);
                $('#syncLog').text("📁 CSV dosyası yüklendi!").css("color", "lime");
            } catch (error) {
                $('#syncLog').text("❌ CSV okunamadı: " + error.message).css("color", "red");
            }
        };
        input.click();
    }
    
    // CSV Export
    function exportToCSV() {
        try {
            const headers = ['id', 'name', 'genre', 'musicQuality', 'lyricsQuality', 'originality', 'instruments', 'writer', 'price', 'isHit'];
            let csvContent = headers.join(',') + '\n';
            
            globalData.forEach(song => {
                const row = headers.map(header => {
                    let value = song[header] || '';
                    
                    if (typeof value === 'string') {
                        if (value.includes(',') || value.includes('"') || value.includes('\n')) {
                            value = '"' + value.replace(/"/g, '""') + '"';
                        }
                    } else if (Array.isArray(value)) {
                        value = value.join(';');
                        if (value.includes(',') || value.includes('"')) {
                            value = '"' + value.replace(/"/g, '""') + '"';
                        }
                    } else if (typeof value === 'boolean') {
                        value = value ? 'true' : 'false';
                    }
                    
                    return value;
                }).join(',');
                
                csvContent += row + '\n';
            });
            
            // Download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `songs_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            $('#syncLog').text(`💾 ${globalData.length} şarkı CSV olarak indirildi`).css("color", "lime");
        } catch (error) {
            $('#syncLog').text("❌ CSV export hatası: " + error.message).css("color", "red");
        }
    }
    
    // CSV Parse (pushToDB içinde kullanılacak)
    function parseCSV(csvText) {
        const lines = csvText.trim().split('\n');
        if (lines.length < 2) return [];
        
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"(.*)"$/, '$1'));
        const songs = [];
        
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line === '') continue;
            
            const values = [];
            let currentValue = '';
            let inQuotes = false;
            
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                
                if (char === '"') {
                    if (inQuotes && j + 1 < line.length && line[j + 1] === '"') {
                        currentValue += '"';
                        j++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    values.push(currentValue.trim());
                    currentValue = '';
                } else {
                    currentValue += char;
                }
            }
            values.push(currentValue.trim());
            
            const song = {};
            headers.forEach((header, index) => {
                let value = values[index] || '';
                
                if (value.startsWith('"') && value.endsWith('"')) {
                    value = value.slice(1, -1).replace(/""/g, '"');
                }
                
                switch (header) {
                    case 'id':
                        song[header] = parseInt(value) || 0;
                        break;
                    case 'musicQuality':
                    case 'lyricsQuality':
                    case 'originality':
                        song[header] = parseInt(value) || 21;
                        break;
                    case 'price':
                        song[header] = parseInt(value) || 0;
                        break;
                    case 'isHit':
                        song[header] = value.toLowerCase() === 'true';
                        break;
                    case 'instruments':
                        song[header] = value ? value.split(';').filter(i => i.trim()) : [];
                        break;
                    default:
                        song[header] = value;
                }
            });
            
            if (song.id && song.name) {
                songs.push(song);
            }
        }
        
        return songs;
    }
    
    // Paste from SongMaster
    function pasteFromClipboard() {
        navigator.clipboard.readText().then(text => {
            if (text) {
                $('#rawJson').val(text);
                $('#syncLog').text("📋 JSON clipboard'dan yapıştırıldı!").css("color", "lime");
            } else {
                $('#syncLog').text("❌ Clipboard'da veri yok!").css("color", "red");
            }
        }).catch(err => {
            // Fallback: Prompt ile al
            const text = prompt("SongMaster'dan kopyaladığınız JSON verisini yapıştırın:");
            if (text) {
                $('#rawJson').val(text);
                $('#syncLog').text("📋 JSON manuel olarak yapıştırıldı!").css("color", "lime");
            }
        });
    }
